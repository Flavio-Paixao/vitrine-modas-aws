<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 660" role="img" aria-labelledby="t d" font-family="system-ui, Segoe UI, Arial, sans-serif">
  <title id="t">Arquitetura do Vitrine Modas</title>
  <desc id="d">Navegador, CloudFront, S3, API Gateway com Cognito, três Lambdas, DynamoDB com streams, publicador, EventBridge, SQS, SNS e observabilidade.</desc>
  <defs>
    <marker id="seta" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#52606d"/>
    </marker>
    <style>
      .caixa { fill: #ffffff; stroke: #3b2f2f; stroke-width: 1.5; rx: 8; }
      .dados { fill: #fdf3e7; stroke: #b7791f; stroke-width: 1.5; rx: 8; }
      .evento { fill: #eef6ff; stroke: #2b6cb0; stroke-width: 1.5; rx: 8; }
      .obs { fill: #f1f5f0; stroke: #4a7c59; stroke-width: 1.5; rx: 8; }
      .zona { fill: none; stroke: #9aa5b1; stroke-width: 1; stroke-dasharray: 6 4; rx: 12; }
      .t { font-size: 14px; fill: #1f2933; text-anchor: middle; }
      .s { font-size: 11.5px; fill: #52606d; text-anchor: middle; }
      .z { font-size: 12px; fill: #52606d; font-weight: 600; }
      .l { stroke: #52606d; stroke-width: 1.6; fill: none; marker-end: url(#seta); }
      .r { font-size: 11px; fill: #52606d; }
    </style>
  </defs>
  <rect width="1000" height="660" fill="#faf7f5"/>

  <!-- Entrada -->
  <rect class="caixa" x="40" y="40" width="150" height="56"/><text class="t" x="115" y="64">Navegador</text><text class="s" x="115" y="82">cliente ou equipe</text>
  <rect class="caixa" x="260" y="40" width="170" height="56"/><text class="t" x="345" y="64">CloudFront</text><text class="s" x="345" y="82">HTTPS, um domínio</text>
  <rect class="dados" x="500" y="40" width="170" height="56"/><text class="t" x="585" y="64">S3 front-end</text><text class="s" x="585" y="82">privado (OAC)</text>
  <path class="l" d="M190,68 L258,68"/>
  <path class="l" d="M430,56 L498,56"/><text class="r" x="436" y="48">/</text>

  <!-- API -->
  <rect class="caixa" x="260" y="150" width="170" height="56"/><text class="t" x="345" y="174">API Gateway</text><text class="s" x="345" y="192">REST, /api/*</text>
  <rect class="caixa" x="500" y="150" width="170" height="56"/><text class="t" x="585" y="174">Cognito</text><text class="s" x="585" y="192">login, tokens, grupos</text>
  <path class="l" d="M345,96 L345,148"/><text class="r" x="352" y="126">/api/*</text>
  <path class="l" d="M430,178 L498,178"/><text class="r" x="436" y="170">valida</text>

  <!-- Lambdas -->
  <rect class="zona" x="40" y="250" width="440" height="100"/><text class="z" x="52" y="268">Lambdas Python (uma role por função)</text>
  <rect class="caixa" x="56" y="282" width="120" height="50"/><text class="t" x="116" y="312">catalogo</text>
  <rect class="caixa" x="190" y="282" width="120" height="50"/><text class="t" x="250" y="312">estoque</text>
  <rect class="caixa" x="324" y="282" width="140" height="50"/><text class="t" x="394" y="312">pedidos</text>
  <path class="l" d="M300,206 L300,250"/>

  <!-- Dados -->
  <rect class="zona" x="40" y="400" width="440" height="110"/><text class="z" x="52" y="504">DynamoDB (cifrado com KMS) e Streams</text>
  <rect class="dados" x="56" y="432" width="120" height="56"/><text class="t" x="116" y="456">produtos</text><text class="s" x="116" y="474">stream</text>
  <rect class="dados" x="190" y="432" width="120" height="56"/><text class="t" x="250" y="456">estoque</text><text class="s" x="250" y="474">stream</text>
  <rect class="dados" x="324" y="432" width="140" height="56"/><text class="t" x="394" y="456">pedidos</text><text class="s" x="394" y="474">stream, índices</text>
  <path class="l" d="M116,332 L116,430"/><path class="l" d="M250,332 L250,430"/><path class="l" d="M394,332 L394,430"/>
  <text class="r" x="386" y="372" text-anchor="end">transação atômica:</text><text class="r" x="386" y="385" text-anchor="end">estoque + pedido</text>

  <!-- Eventos -->
  <rect class="zona" x="540" y="250" width="420" height="260"/><text class="z" x="552" y="268">Eventos</text>
  <rect class="evento" x="560" y="290" width="150" height="50"/><text class="t" x="635" y="312">publicador</text><text class="s" x="635" y="328">Lambda (lê streams)</text>
  <rect class="evento" x="780" y="290" width="160" height="50"/><text class="t" x="860" y="312">EventBridge</text><text class="s" x="860" y="328">barramento + regras</text>
  <rect class="evento" x="760" y="380" width="90" height="46"/><text class="t" x="805" y="408">SQS</text>
  <rect class="evento" x="870" y="380" width="70" height="46"/><text class="t" x="905" y="408">SNS</text>
  <rect class="evento" x="560" y="380" width="150" height="50"/><text class="t" x="635" y="402">processador</text><text class="s" x="635" y="420">confirma o pedido</text>
  <rect class="evento" x="760" y="450" width="90" height="40"/><text class="t" x="805" y="475">DLQ</text>
  <path class="l" d="M464,462 L520,462 L520,315 L558,315"/><text class="r" x="526" y="440">streams</text><text class="r" x="526" y="453">das 3 tabelas</text>
  <path class="l" d="M710,315 L778,315"/>
  <path class="l" d="M830,340 L805,378"/><text class="r" x="738" y="362">PedidoCriado</text>
  <path class="l" d="M890,340 L905,378"/><text class="r" x="912" y="362">EstoqueBaixo</text>
  <path class="l" d="M758,403 L712,403"/>
  <path class="l" d="M805,426 L805,448"/><text class="r" x="812" y="441">3 falhas</text>

  <!-- Observabilidade -->
  <rect class="zona" x="40" y="550" width="920" height="80"/><text class="z" x="52" y="568">Observabilidade e custo</text>
  <rect class="obs" x="60" y="578" width="200" height="40"/><text class="t" x="160" y="597">CloudWatch</text><text class="s" x="160" y="611">alarmes e dashboard</text>
  <rect class="obs" x="290" y="578" width="170" height="40"/><text class="t" x="375" y="597">X-Ray</text><text class="s" x="375" y="611">traços das requisições</text>
  <rect class="obs" x="490" y="578" width="170" height="40"/><text class="t" x="575" y="597">AWS Budgets</text><text class="s" x="575" y="611">orçamento mensal</text>
  <rect class="evento" x="690" y="578" width="250" height="40"/><text class="t" x="815" y="597">SNS (alertas)</text><text class="s" x="815" y="611">recebe alarmes e avisos de orçamento</text>
</svg>
